name: steam-library-matrix

services:
  app:
    image: steam-library-matrix:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    # docker/.env first; repo-root .env second (fills STEAM_API_KEY if docker/.env left it blank)
    env_file:
      - .env
      - path: ../.env
        required: false
    # Reachable from your LAN; use "127.0.0.1:3001:3000" to keep it on this machine only
    ports:
      - "3001:3000"
    # Entrypoint runs as root: CHOWN/FOWNER for chown/chmod of the DB dir, DAC_OVERRIDE to write
    # nextjs-owned files and /app/.env*, SETUID/SETGID for su-exec to drop to nextjs
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    # su-exec only drops privileges, so no-new-privileges does not block it
    security_opt: ["no-new-privileges:true"]
    environment:
      APP_ROOT: /app
      DATABASE_URL: file:/app/data/db/matrix.db
      SLM_SEED_DIR: /app/data/seed
      # Fast enrichment defaults (match pnpm dev:all; override in docker/.env)
      SLM_EMBED_JOB_WORKER: "true"
      SLM_EMBED_WORKER_MS: "5000"
      SLM_WORKER_MAX_JOBS_PER_TICK: "8"
      SLM_WORKER_TICK_BUDGET_MS: "50000"
      SLM_WORKER_PARALLEL_TICKS: "4"
      SLM_APP_DETAILS_BATCH: "30"
      SLM_APP_DETAILS_CONCURRENCY: "6"
      SLM_PROTONDB_BATCH: "50"
      SLM_PROTONDB_CONCURRENCY: "10"
      SLM_ACHIEVEMENTS_BATCH: "60"
      SLM_ACHIEVEMENTS_CONCURRENCY: "8"
      SLM_HLTB_BATCH: "16"
      SLM_HLTB_CONCURRENCY: "6"
      SLM_HLTB_STAGGER_MS: "300"
      SLM_ENRICH_VERBOSE: "true"
    # Live DB in a named volume (avoids WAL corruption on bind mounts). Seed JSON stays read-only from the repo.
    volumes:
      - matrix_db:/app/data/db
      - ../data/seed:/app/data/seed:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>r.json()).then((j)=>process.exit(j.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  matrix_db:
